name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/RepairTracker-v1.0.${{ github.run_number }}.apk

      - name: Save APK (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: RepairTracker-APK
          path: out/*.apk

      - name: Publish APK (Releases page - easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Repair Tracker v1.0.${{ github.run_number }}
          body: Download the APK below and install it on your phone. It updates the old version and keeps your jobs.
          files: out/*.apk
