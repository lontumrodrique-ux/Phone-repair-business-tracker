name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/RepairTracker-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RepairTracker-APK
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Repair Tracker v1.0.${{ github.run_number }}
          files: out/*.apk
